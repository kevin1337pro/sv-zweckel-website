name: Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned build dependencies
        run: npm ci

      - name: Build 3D assets and check public pages
        run: npm test

      - name: Prepare public files only
        run: |
          mkdir -p _site/assets/fonts
          cp ./*.html styles.css data.js script.js .nojekyll _site/
          cp assets/*.jpg assets/*.png assets/*.webp _site/assets/
          cp assets/fonts/*.woff2 assets/fonts/*OFL.txt _site/assets/fonts/
          cp -R assets/football _site/assets/football

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
